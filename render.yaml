# Render Blueprint：Dashboard → New → Blueprint → 选择本仓库。
#
# 实例规格：测量一张 A3 大图（如 102 图）时内存峰值实测约 0.7–0.84 GB（内存优化后；优化前 3.3 GB），
# 加上网页服务与系统余量约需 1.3 GB：512 MB（含免费实例）不够，1c-2g（2 GB，US$25/月，2026-11 Render 价格）够用。
# 磁盘 US$0.25/GB·月，只在付费实例上可用；没有磁盘时，每次重启或重新部署都会清空图纸库与历史结果。
# ACCESS_PASSWORD 在 Dashboard 中填写（不写进仓库）；设置后整个网站需要密码，/api/health 除外。

services:
  - type: web
    name: layout-footprint-estimator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    repo: https://github.com/hemeiling/ProjectedArea
    branch: main
    region: singapore           # 离国内用户最近的 Render 区域
    plan: 1c-2g                 # 1 CPU / 2 GB 内存
    numInstances: 1             # 任务状态在进程内：只能单实例
    healthCheckPath: /api/health
    disk:
      name: estimator-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: LAYOUT_DATA_DIR
        value: /var/data
      - key: ACCESS_PASSWORD
        sync: false
