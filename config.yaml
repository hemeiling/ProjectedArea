extraction:
  render_px_per_pt: 4               # 栅格分辨率；4 ≈ 每像素 16–25 mm
  building:
    min_line_frac: 0.6              # 长度 ≥ 60% 总尺寸的线 = 厂房边界
  hatch:                            # 墙体/通道的 45° 斜线填充区，区内内容全部排除
    enabled: true
    angle_min: 30
    angle_max: 60
    min_segment_mm: 1500            # 填充斜线单根长度 ≥1.5 m；设备内斜线都更短
    close_mm: 3000                  # 斜线间距约 2–3 m，用 3 m 闭合成片
    min_area_m2: 40                 # 小于此面积的斜线团视为设备本身的斜撑，不排除
  exclude_colors:                   # 非设备图层颜色（RGB 0–1）
    - [1.0, 1.0, 0.0]               # 黄色：安全围栏/虚线范围/注释
  near_white: 0.9                   # 接近白色的线（大号水印文字）忽略
  max_path_extent_mm: 14000         # 单条路径长于此 = 墙/轴线/尺寸线，排除
  route_grey_range: [0.4, 0.85]     # 灰色线条可能是物流通道/AGV 路线
  route_max_segment_mm: 4000        # 灰色直线段长于此视为通道线，排除
  agv_circles:                      # AGV 转弯圆（OpenCV 霍夫圆检测）
    enabled: true
    min_radius_mm: 600
    max_radius_mm: 1300
    vote_threshold: 18
  gap_close_mm: 150                 # 线条间 <150 mm 的缝隙视为同一设备
  min_feature_mm: 250               # 宽度 <250 mm 的细线（墙线/尺寸线/通道线/箭头）去除
  max_hole_fill_m2: 20              # 只填充 <20 m² 的封闭区（设备内部），更大的是通道围合区
  min_group_m2: 0.25                # 小于此面积的碎片（文字、标记）忽略
  lane_separator_frac: 0.8          # 沿线贯通 ≥80% 长度的填充带 = 线体分隔带
  envelope_min_group_m2: 2          # 基准“总长×宽”只按 ≥2 m² 的设备块取外包矩形
  stations:                         # 工位标签识别（OCR）与面积分摊
    enabled: true
    label_max_lightness: 0.1        # 只把黑色文字当作工位标签
    title_size_factor: 3            # 字号 > 3×中位字号 = 图名，忽略
    cluster_gap_mm: 800             # 字形间距 <0.8 m 归为同一标签
    ocr_dpi: 600
    min_name_letters: 4             # 无 OP 编号时，至少 4 个字母才算标签
    column_tolerance_mm: 4000       # 横向相差 <4 m 的标签属于同一标签列

# ---------- 第二步：公摊工时（业务输入，不由图纸推断）----------
dxf:                                # DXF 输入（dxf_footprint.py）。闭合缺口、填充内部、去细线、碎片阈值与上面 extraction 共用
  resolution_mm: 10                 # 每个图块栅格化的分辨率（mm/像素）
  curve_tolerance_mm: 1             # 圆弧、样条等曲线离散为折线的最大偏差
  exclude_colours: [2]              # ACI 2 黄色：安全围栏/注释（与 PDF 方法的 exclude_colors 一致）
  exclude_layers: [ASHADE]          # 渲染灯光图层；关闭、冻结、不打印的图层和 Defpoints 自动排除
  exclude_bound_xref_layers: true   # 绑定的外部参照图层（名称含 $0$，如建筑底图的墙、窗、轴网、图框）不计入
  cluster_mm: 2000                  # 打散在模型空间的线条按此网格邻接聚成一团（一台设备）
  offline_gap_mm: 20000             # 无背景框时：与主体设备相距超过此值的图形视为线外，不计入
  bare_outline_max_polylines: 4     # 只有 ≤ 4 条线、没有内部细节的图形（区域框、预留位）列为待定，不计入
  lane_gap_mm: 3000                 # 线体分隔：与产线长边平行、贯穿全图、宽 ≥ 3 m 的空走道（线体之间的主通道一般 ≥ 3 m；
                                    # 更窄的贯通空隙是线体内的操作通道，不分开）。基准按线体分别取外包矩形再相加
  max_object_mm: 200000             # 单个图块/线团跨度超过 200 m（混有远处零散图形）时先按邻近拆分
  max_raster_px: 150000000          # 单个栅格上限（像素）；超过时降低分辨率并在结果中警告

labor:                              # 工时表中“公摊&投影面积”一行：钳工、电工各算一次，两者相加
  area_basis: baseline              # 按哪种面积算公摊工时：baseline = 产线总长×宽（现行做法），fine = 各工位投影面积之和
  area_basis_source: "用户确认（2026-11-02）：工时表“公摊&投影面积”人工录入的是产线总长×宽"
  fitter_hours_per_m2: 0.52         # 钳工 公摊工时系数（工时 / m²）
  electrician_hours_per_m2: 0.52    # 电工 公摊工时系数（工时 / m²）
  source: "现有《钳工/电工工时推算》表：钳工、电工各有一行“公摊&投影面积”，均为 0.52 小时/m²"

# ---------- 第二步：装箱参数（应以历史装柜数据校准）----------
packing:
  packaging_factor: 1.15            # 包装后面积 / 设备投影面积
  container: {name: "40HQ", inner_length_m: 12.03, inner_width_m: 2.35, inner_height_m: 2.69, max_payload_t: 26.5}
  floor_utilisation: {low: 0.75, high: 0.88}   # 唐总（2026-11）：保留保守、乐观两个值，取较高区间（实测 75%–88%）。待意大利项目数据校准
  # 尺寸规则（唐总，2026-11）：设备极限宽度 2.1 m，木箱每边约 0.12 m（板厚约 0.1 m + 间隙）→ 箱宽 2.34 m，刚好装进 40HQ 内宽 2.35 m
  oversize_share: 0.0               # 框架箱/开顶箱比例。默认 0：是否走框架箱/开顶箱由人工决定，在网页按线填写柜数（业务决定，2026-11）

