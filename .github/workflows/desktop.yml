# 桌面版安装包：在 GitHub 的 Windows / macOS 机器上分别打包、自检，产物在本次运行的 Artifacts 中下载。
# 手动运行：Actions → desktop-app → Run workflow；推送 v* 标签时同时发布到 Releases。
name: desktop-app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # 只在推送标签时用于创建 Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip: LayoutEstimator-Windows.zip
          - os: macos-14          # Apple 芯片
            zip: LayoutEstimator-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-desktop.txt

      # Windows：附带 Tesseract（UB Mannheim 版，含英文语言包），同事无需另装即可识别工位
      - name: Bundle Tesseract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          New-Item -ItemType Directory -Force vendor\tesseract | Out-Null
          Copy-Item "C:\Program Files\Tesseract-OCR\*" vendor\tesseract -Recurse
          vendor\tesseract\tesseract.exe --version

      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm desktop.spec

      # 自检：用打包好的程序算一张合成图纸（经过子进程测量、生成 Excel），面积必须正确
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SMOKE_EXPECT_OCR: "1"
        run: |
          $p = Start-Process -FilePath dist\LayoutEstimator\LayoutEstimator.exe -ArgumentList "--smoke-test" `
               -Wait -PassThru -NoNewWindow -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke.txt; Get-Content smoke-err.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Compress-Archive -Path dist\LayoutEstimator -DestinationPath ${{ matrix.zip }}
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/LayoutEstimator.app/Contents/MacOS/LayoutEstimator --smoke-test
          ditto -c -k --keepParent dist/LayoutEstimator.app ${{ matrix.zip }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
